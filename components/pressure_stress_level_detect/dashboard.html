<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Caregiver Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      color-scheme: dark;

      --bg0: #070a16;
      --bg1: #0b1030;
      --card: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.12);
      --text: rgba(255, 255, 255, 0.92);
      --muted: rgba(255, 255, 255, 0.72);
      --primary: #7c6cff;
      --accent: #21d4fd;
      --danger: #ff4c4c;
      --success: #2ecc71;
      --shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      background:
        radial-gradient(1200px 600px at 15% 5%, rgba(124, 108, 255, 0.30), transparent 60%),
        radial-gradient(900px 520px at 85% 15%, rgba(33, 212, 253, 0.22), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Inter, Arial;
      line-height: 1.45;
      min-height: 100vh;
    }

    .panel {
      max-width: 980px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    h2 {
      margin: 0;
      font-size: clamp(18px, 2.8vw, 26px);
      letter-spacing: 0.2px;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.86);
      font-weight: 800;
      font-size: 12px;
      white-space: nowrap;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(33, 212, 253, 0.12);
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.2px;
      color: rgba(255, 255, 255, 0.92);
    }

    .grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 14px;
    }

    .tip {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(46, 204, 113, 0.20);
      color: rgba(255, 255, 255, 0.88);
      padding: 14px;
      border-radius: 14px;
    }

    .tip b {
      color: rgba(255, 255, 255, 0.95);
    }

    .tip ul {
      margin: 10px 0 0;
      padding-left: 18px;
    }

    .tip li {
      margin: 8px 0;
      color: rgba(255, 255, 255, 0.84);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      background: rgba(255, 255, 255, 0.06);
      font-weight: 800;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.86);
    }

    canvas {
      width: 100% !important;
      height: auto !important;
      margin-top: 6px;
    }

    @media (max-width: 860px) {
      body {
        padding: 14px;
      }

      header {
        flex-direction: column;
        align-items: flex-start;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="panel">
    <header>
      <div>
        <h2>Caregiver Stress Overview</h2>
        <p class="subtitle">Weekly summary with time-of-day patterns</p>
      </div>
      <div class="badge"><span class="dot"></span><span id="statusBadge">Insights updated: sample data</span></div>
    </header>

    <div class="card">
      <h3>Daily Stress Trend</h3>
      <canvas id="daily"></canvas>
    </div>

    <div class="card">
      <h3>Stress by Day & Time</h3>
      <canvas id="hourly"></canvas>
    </div>

    <div class="card">
      <h3>Caregiver Recommendations</h3>
      <div class="tip">
        <div class="pill">Data-driven suggestions</div>
        <ul id="recommendations"></ul>
      </div>
    </div>
  </div>

  <script>
    // Sample data model:
    // days: 0..6 (Mon..Sun)
    // time: hour in 24h (6..22)
    // stress: 0..1
    const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const HOURS = [6, 8, 10, 12, 14, 16, 18, 20, 22];

    // Real-world-ish sample pattern:
    // - commute / outdoor movement: higher late afternoon
    // - fatigue peaks: evenings
    // - fewer events on weekend mornings
    const stressGrid = [
      // Mon
      [0.18, 0.22, 0.28, 0.35, 0.42, 0.55, 0.78, 0.72, 0.50],
      // Tue
      [0.16, 0.20, 0.26, 0.30, 0.38, 0.48, 0.62, 0.58, 0.42],
      // Wed
      [0.17, 0.21, 0.25, 0.33, 0.40, 0.52, 0.70, 0.64, 0.45],
      // Thu
      [0.20, 0.24, 0.30, 0.38, 0.46, 0.60, 0.86, 0.80, 0.58],
      // Fri
      [0.19, 0.24, 0.29, 0.36, 0.44, 0.56, 0.74, 0.69, 0.52],
      // Sat
      [0.12, 0.14, 0.18, 0.24, 0.30, 0.38, 0.48, 0.44, 0.33],
      // Sun
      [0.13, 0.15, 0.19, 0.26, 0.32, 0.40, 0.52, 0.47, 0.36]
    ];

    function clamp01(x) {
      return Math.min(1, Math.max(0, x));
    }

    function stressColor(value) {
      // value in [0,1] -> green to red
      const v = clamp01(value);
      const r = Math.round(46 + (255 - 46) * v);
      const g = Math.round(204 + (76 - 204) * v);
      const b = Math.round(113 + (76 - 113) * v);
      return `rgba(${r}, ${g}, ${b}, 0.85)`;
    }

    function buildDailyAverages() {
      return stressGrid.map(row => row.reduce((a, b) => a + b, 0) / row.length);
    }

    function flattenToPoints() {
      const points = [];
      for (let d = 0; d < stressGrid.length; d++) {
        for (let h = 0; h < HOURS.length; h++) {
          const s = stressGrid[d][h];
          points.push({ x: HOURS[h], y: d, s });
        }
      }
      return points;
    }

    function findPeaks(points, n = 3) {
      return [...points]
        .sort((a, b) => b.s - a.s)
        .slice(0, n);
    }

    function hourLabel(hour) {
      const h = Number(hour);
      const suffix = h >= 12 ? 'PM' : 'AM';
      const hh = ((h + 11) % 12) + 1;
      return `${hh}${suffix}`;
    }

    // Daily trend
    const dailyAverages = buildDailyAverages();
    new Chart(daily, {
      type: 'line',
      data: {
        labels: DAYS,
        datasets: [{
          label: 'Avg Stress (0–1)',
          data: dailyAverages,
          borderColor: 'rgba(255, 76, 76, 0.95)',
          backgroundColor: 'rgba(255, 76, 76, 0.15)',
          fill: true,
          tension: 0.35,
          pointRadius: 4,
          pointHoverRadius: 6
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { labels: { color: 'rgba(255,255,255,0.75)' } }
        },
        scales: {
          x: { ticks: { color: 'rgba(255,255,255,0.65)' }, grid: { color: 'rgba(255,255,255,0.06)' } },
          y: { min: 0, max: 1, ticks: { color: 'rgba(255,255,255,0.65)' }, grid: { color: 'rgba(255,255,255,0.06)' } }
        }
      }
    });

    // Day & time chart (visual heatmap using scatter points)
    const points = flattenToPoints();
    new Chart(hourly, {
      type: 'scatter',
      data: {
        datasets: [{
          label: 'Stress intensity',
          data: points,
          parsing: false,
          pointRadius: (ctx) => {
            const s = ctx.raw?.s ?? 0;
            return 5 + 10 * s;
          },
          pointHoverRadius: (ctx) => {
            const s = ctx.raw?.s ?? 0;
            return 7 + 12 * s;
          },
          pointBackgroundColor: (ctx) => stressColor(ctx.raw?.s ?? 0),
          pointBorderColor: 'rgba(255,255,255,0.15)',
          pointBorderWidth: 1
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              title: (items) => {
                const p = items[0]?.raw;
                if (!p) return '';
                return `${DAYS[p.y]} • ${hourLabel(p.x)}`;
              },
              label: (item) => {
                const s = item.raw?.s ?? 0;
                return `Stress: ${(s * 100).toFixed(0)}%`;
              }
            }
          }
        },
        scales: {
          x: {
            min: 6,
            max: 22,
            ticks: {
              color: 'rgba(255,255,255,0.65)',
              callback: (value) => hourLabel(value)
            },
            grid: { color: 'rgba(255,255,255,0.06)' },
            title: {
              display: true,
              text: 'Time of Day',
              color: 'rgba(255,255,255,0.72)',
              font: { weight: 'bold' }
            }
          },
          y: {
            min: -0.5,
            max: 6.5,
            ticks: {
              stepSize: 1,
              color: 'rgba(255,255,255,0.65)',
              callback: (value) => DAYS[value] ?? ''
            },
            grid: { color: 'rgba(255,255,255,0.06)' },
            title: {
              display: true,
              text: 'Day',
              color: 'rgba(255,255,255,0.72)',
              font: { weight: 'bold' }
            }
          }
        }
      }
    });

    // Recommendations derived from peaks + daily averages
    const peaks = findPeaks(points, 3);
    const worstDay = dailyAverages
      .map((v, i) => ({ day: i, v }))
      .sort((a, b) => b.v - a.v)[0];

    const bestDay = dailyAverages
      .map((v, i) => ({ day: i, v }))
      .sort((a, b) => a.v - b.v)[0];

    const HIGH = 0.72;
    const highWindows = points.filter(p => p.s >= HIGH);
    const mostCommonHour = (() => {
      const freq = new Map();
      for (const p of highWindows) freq.set(p.x, (freq.get(p.x) ?? 0) + 1);
      let best = null;
      for (const [k, v] of freq.entries()) {
        if (!best || v > best.v) best = { k, v };
      }
      return best?.k;
    })();

    const rec = [];
    rec.push(`Highest overall stress day: <b>${DAYS[worstDay.day]}</b> (avg ${(worstDay.v * 100).toFixed(0)}%). Plan extra support, slower pace, and scheduled rest breaks.`);
    rec.push(`Lowest stress day: <b>${DAYS[bestDay.day]}</b> (avg ${(bestDay.v * 100).toFixed(0)}%). Use this day for longer walks or training routes.`);

    if (mostCommonHour != null) {
      rec.push(`Repeated high-stress time window around <b>${hourLabel(mostCommonHour)}</b>. Try pre-emptive actions: hydration reminder, brief stop, and calming voice guidance before that hour.`);
    }

    rec.push(`When stress goes above ~<b>${(HIGH * 100).toFixed(0)}%</b>, consider switching to a "low stimulation" mode: reduce speed, avoid noisy streets, and use short reassurance prompts.`);
    rec.push(`If high stress appears with strong grip pressure, check for discomfort: handle height, strap tightness, or friction points. Small hardware adjustments often reduce stress quickly.`);

    // Mention the top peak specifically (real-world scenario)
    const top = peaks[0];
    if (top) {
      rec.unshift(`Peak stress detected at <b>${DAYS[top.y]} ${hourLabel(top.x)}</b> ( ${(top.s * 100).toFixed(0)}% ). This often matches crowded areas/traffic or fatigue—consider an alternate route or earlier outing.`);
    }

    const ul = document.getElementById('recommendations');
    ul.innerHTML = rec.map(r => `<li>${r}</li>`).join('');

    const badge = document.getElementById('statusBadge');
    badge.textContent = 'Insights updated: sample week pattern';
  </script>
</body>

</html>
